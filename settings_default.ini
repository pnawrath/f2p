# f2p settings
# Edit, save, done. f2p reads this file every time it runs.
# Lists are comma-separated. Upper/lower case does not matter.
# To go back to the defaults, delete this file; the next f2p run recreates it.

[gates]
# Gates ticked by default when their name contains one of these words.
default = live, 107a, ifn, tnf
# Gates found in fewer than this share of the samples are not ticked (0-100 %).
min_presence = 10

[variables]
# Ticked by default in the popup (yes / no). MFI only works if the
# workspace contains Median/Mean statistics.
frequency = yes
cells = no
mfi = no

[groups]
# FlowJo groups that never become a plate.
skip = All Samples, Compensation

[viability]
# Gate names (start of the name) that get the viability colour bands.
names = live, alive, viable, viability
# below % = colour (hex). Checked from the lowest limit up; >= highest = no colour.
bands = 50 = D4A496, 80 = E6C3A1, 90 = F1E5C6

[colours]
# Gradient for all other gates: lowest value -> highest value.
gradient_low = FFFFFF
gradient_high = F8A35E
